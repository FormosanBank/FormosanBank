name: hf-audio-parity

on:
  pull_request:
    paths:
      - 'Corpora/**/*.xml'
      - 'audio_sources.json'
      - 'audio_extras.json'
      - 'QC/validation/validate_hf_audio.py'
      - '.github/workflows/hf-audio-parity.yaml'
  push:
    branches: [main]
    paths:
      - 'Corpora/**/*.xml'
      - 'audio_sources.json'
      - 'audio_extras.json'
      - 'QC/validation/validate_hf_audio.py'
      - '.github/workflows/hf-audio-parity.yaml'
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate public Hugging Face audio
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check anonymous public audio parity
        env:
          HF_TOKEN: ''
        run: python QC/validation/validate_hf_audio.py
