name: Corpus Metrics

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Corpora/**"
      - "QC/corpus_metrics.py"
      - "QC/corpus_counts.py"
      - "QC/utilities/audio_durations.py"
      - "QC/utilities/get_corpus_stats.py"
      - "QC/reference/corpus_benchmarks.json"
      - "statistics/audio_durations.csv"
      - ".github/workflows/corpus-metrics.yaml"
  pull_request:
    paths:
      - "Corpora/**"
      - "QC/corpus_metrics.py"
      - "QC/corpus_counts.py"
      - "QC/utilities/audio_durations.py"
      - "QC/utilities/get_corpus_stats.py"
      - "QC/reference/corpus_benchmarks.json"
      - "statistics/audio_durations.csv"
      - ".github/workflows/corpus-metrics.yaml"

jobs:
  corpus-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install plotting dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install matplotlib

      - name: Generate per-corpus statistics CSVs
        run: |
          python3 QC/utilities/get_corpus_stats.py --all --strict

      - name: Generate corpus metrics
        run: |
          python3 QC/corpus_metrics.py Corpora \
            --stats-dir statistics \
            --output-dir corpus-metrics \
            --history-extend \
            --history-cache statistics/corpus_size_history.csv

      - name: Add metrics summary
        run: cat corpus-metrics/corpus_metrics.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated statistics
        # workflow_dispatch counts: a manual run is how a lost or skipped
        # auto-commit gets recovered, and gating this step on 'push' alone
        # made every dispatch a silent no-op — it regenerated the CSVs,
        # uploaded them as an artifact, skipped this step, and reported
        # success.
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
        run: |
          mkdir -p statistics
          cp corpus-metrics/corpus_size_history.csv statistics/corpus_size_history.csv
          cp corpus-metrics/corpus_size_over_time.png statistics/corpus_size_over_time.png
          cp corpus-metrics/corpus_transcribed_audio_over_time.png statistics/corpus_transcribed_audio_over_time.png
          cp corpus-metrics/corpus_mandarin_words_over_time.png statistics/corpus_mandarin_words_over_time.png
          cp corpus-metrics/corpus_glossed_words_over_time.png statistics/corpus_glossed_words_over_time.png

          git add statistics/corpus_size_history.csv \
            statistics/corpus_size_over_time.png \
            statistics/corpus_transcribed_audio_over_time.png \
            statistics/corpus_mandarin_words_over_time.png \
            statistics/corpus_glossed_words_over_time.png \
            statistics/*_corpora_stats.csv
          if git diff --cached --quiet; then
            echo "No statistics changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update corpus statistics and growth graph"

          # Rebase and retry rather than push once. This job takes minutes —
          # it regenerates every per-corpus CSV, then walks history for
          # --history-extend — so anything landing on main meanwhile makes a
          # bare push fail non-fast-forward and drops the statistics commit on
          # the floor. Worse, the trigger is path-filtered, so a later merge
          # that touches no Corpora/** path never retries it: on 2026-09-11
          # the Amis-Pa-Verbs stats CSV was lost this way to a merge that
          # landed 15 seconds after the one that started this job.
          #
          # Rebasing is safe here because the commit only ever touches
          # generated files under statistics/, which this job owns.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            git fetch origin main || exit 1
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          echo "still could not push after 3 attempts" >&2
          exit 1

      - name: Upload corpus metrics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: corpus-metrics
          path: corpus-metrics/
          retention-days: 30
