name: xml-validation

# Runs the FormosanBank validation pipeline against corpus data:
# - validate_xml.py (stage 1 — XML format/schema)
# - validate_glosses.py (stage 2 — gloss artifacts, added in B9.3)
#
# Runs on pull requests only: the validators on EVERY .xml file the PR
# touches under `Corpora/*/XML/`. Modified files block only HARD finding
# fingerprints absent from the PR base. Added files have an empty baseline
# and must contain no HARD findings. Existing legacy findings remain visible
# without forcing contributors to delete or rewrite valid archival records.
#
# There is no after-merge run: a full-Corpora informational baseline used
# to run on every push to main, but nothing consumed its reports, so it was
# removed (maintainer, 2026-11-11).
#
# Gloss-validation severity policy:
# - New HARD findings block the PR. Existing HARD findings in modified
#   legacy files remain visible but do not prevent unrelated repairs.
# - SOFT findings are emitted as warnings but do not fail the job.
#   Added files have no baseline, so every HARD finding is new.

on:
  pull_request:
    paths:
      - 'Corpora/**.xml'
      - 'QC/validation/**'
      - '.github/workflows/xml-validation.yaml'

jobs:
  validate-changed-files:
    name: Validate XML files changed by this PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # we need history to diff against the PR base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Identify XML files changed in this PR
        id: changed
        run: |
          # Files added or modified (not deleted) under Corpora/*/XML/.
          # Excludes files outside the canonical XML/ subdir.
          #
          # The :(glob) magic is load-bearing. In a default pathspec '*'
          # matches '/' too, so 'Corpora/**/XML/**' also picked up
          # Corpora/<name>/CodeAndDocs/pre_correction_snapshot/XML/ --
          # POL-035 baselines, which are inputs to a corpus build, not
          # published data. Validating one as if it were published raises
          # HARD V081 (duplicate TEXT/@id) against the corpus it is the
          # baseline for. Under :(glob), '*' stops at '/' and '**' does not,
          # so only the canonical Corpora/<name>/XML/ tree matches, which is
          # what the comment above always claimed.
          #
          # core.quotePath=false is load-bearing too. By default git prints a
          # path with non-ASCII bytes C-quoted ("Corpora/.../Cond\303\251.xml"),
          # a name no file has. The validators then read 0 files and write an
          # empty findings CSV, so the step below passed on files it never
          # opened, and validate_glosses wrote no CSV at all, failing stage 2.
          git -c core.quotePath=false diff --name-only --diff-filter=AM \
            "origin/${{ github.base_ref }}...HEAD" \
            -- ':(glob)Corpora/*/XML/**/*.xml' > changed_xml.txt
          # Every listed path must be a file; one that is not would be checked
          # vacuously, so stop here instead.
          missing=0
          while IFS= read -r file; do
            if [ ! -f "$file" ]; then
              echo "::error::Listed as changed but not a file: $file"
              missing=1
            fi
          done < changed_xml.txt
          [ "$missing" -eq 0 ] || exit 1
          count=$(wc -l < changed_xml.txt)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Changed canonical XML files: $count"
          if [ "$count" -gt 0 ]; then
            echo "Files:"
            cat changed_xml.txt
          fi
      - name: A changed corpus may not shelter on a pending list
        if: steps.changed.outputs.count != '0'
        run: |
          # The four root-level pending lists skip legacy corpora in pytest.
          # They only shrink, and a PR that rebuilds a corpus is when its line
          # goes; without this step a re-port could leave its corpus listed and
          # never be gated by those tests.
          python QC/validation/check_pending_lists.py --changed changed_xml.txt

      - name: Block newly introduced hard XML and text findings
        if: steps.changed.outputs.count != '0'
        run: |
          # Validate candidate and base versions independently. Finding
          # identity excludes the temporary file path, so unchanged
          # rule/location fingerprints compare cleanly.
          fail=0
          index=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            index=$((index + 1))
            base_file="/tmp/xml-base-files/$file"

            for validator in validate_xml validate_text; do
              candidate="/tmp/$validator-head-$index.csv"
              baseline="/tmp/$validator-base-$index.csv"

              echo "::group::$validator $file"
              python "QC/validation/$validator.py" \
                --no-exit-on-hard \
                by_path --path "$file" \
                --csv "$candidate"

              compare_args=(
                --candidate "$candidate"
                --severity HARD
              )
              if git cat-file -e "origin/${{ github.base_ref }}:$file"; then
                mkdir -p "$(dirname "$base_file")"
                git show "origin/${{ github.base_ref }}:$file" > "$base_file"
                python "QC/validation/$validator.py" \
                  --no-exit-on-hard \
                  by_path --path "$base_file" \
                  --csv "$baseline"
                compare_args+=(--baseline "$baseline")
              fi

              if ! python QC/validation/compare_findings.py \
                   "${compare_args[@]}"; then
                fail=1
              fi
              echo "::endgroup::"
            done
          done < changed_xml.txt
          exit $fail
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Block newly introduced hard gloss findings (stage 2)
        if: steps.changed.outputs.count != '0'
        run: |
          # Modified legacy XML may already contain hard gloss findings.
          # Validate the candidate and its base version independently,
          # then block only hard rule/location fingerprints introduced
          # by the PR. Added files have an empty baseline and therefore
          # must contain no hard gloss findings.
          fail=0
          index=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            index=$((index + 1))
            head_dir="/tmp/gloss-head-$index"
            base_dir="/tmp/gloss-base-$index"
            base_file="/tmp/gloss-base-files/$file"

            echo "::group::validate_glosses $file"
            python QC/validation/validate_glosses.py \
              by_path --path "$file" \
              --output_dir "$head_dir" \
              --no-exit-on-hard

            compare_args=(
              --candidate "$head_dir/validate_glosses_findings.csv"
              --severity HARD
            )
            if git cat-file -e "origin/${{ github.base_ref }}:$file"; then
              mkdir -p "$(dirname "$base_file")"
              git show "origin/${{ github.base_ref }}:$file" > "$base_file"
              python QC/validation/validate_glosses.py \
                by_path --path "$base_file" \
                --output_dir "$base_dir" \
                --no-exit-on-hard
              compare_args+=(--baseline "$base_dir/validate_glosses_findings.csv")
            fi

            if ! python QC/validation/compare_findings.py "${compare_args[@]}"; then
              fail=1
            fi
            echo "::endgroup::"
          done < changed_xml.txt
          exit $fail
        env:
          PYTHONPATH: ${{ github.workspace }}
