name: audio-validation

# Runs the always-on broken-audio checks (validate_audio.py) on pull requests,
# for each corpus the PR touches that has audio committed to the repo.
# HARD findings (V100-V103: missing / unloadable / silent / invalid_range)
# block the PR. SOFT findings (V104-V105: duration / words-per-sec) log but
# don't fail.
#
# There is no after-merge run: an informational full-Corpora baseline used to
# run on every push to main, but nothing consumed its reports (maintainer,
# 2026-11-11). Audio files are gitignored except where a corpus commits them;
# XML QC owns structural range validation, and exact public XML-to-Hugging-Face
# parity and source permissions are enforced by hf-audio-parity.yaml.

on:
  pull_request:
    paths:
      # Only corpora with audio files committed to the repo; every other
      # corpus's audio is on Hugging Face and is never present in CI, so the
      # job had nothing to check there. tests/validators/
      # test_audio_validation_trigger.py fails if a corpus gains committed
      # audio without being listed here.
      - 'Corpora/Paiwan_Stories/**'
      - 'QC/validation/validate_audio.py'
      - '.github/workflows/audio-validation.yaml'

jobs:
  validate-changed-corpora:
    name: Validate audio for corpora touched by this PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install ffmpeg (for MP3 silence detection)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Identify corpora with XML changes
        id: changed
        run: |
          # List unique corpus dirs whose XML changed in this PR.
          # :(glob) so '*' stops at '/' and only the canonical
          # Corpora/<name>/XML/ tree matches -- not the POL-035 snapshots
          # under CodeAndDocs/pre_correction_snapshot/XML/. See the same
          # note in xml-validation.yaml.
          # core.quotePath=false: see the same note in xml-validation.yaml.
          git -c core.quotePath=false diff --name-only --diff-filter=AM \
            "origin/${{ github.base_ref }}...HEAD" \
            -- ':(glob)Corpora/*/XML/**/*.xml' \
            | awk -F/ '{ print "Corpora/" $2 }' \
            | sort -u > changed_corpora.txt
          count=$(wc -l < changed_corpora.txt)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Corpora touched: $count"
          if [ "$count" -gt 0 ]; then
            cat changed_corpora.txt
          fi
      - name: Run validate_audio.py for each affected corpus
        if: steps.changed.outputs.count != '0'
        run: |
          # HARD findings (V100-V103) block the PR; SOFT findings warn.
          # Do not manufacture V100 failures when no local audio exists:
          # most release corpora reference remote or externally stored files.
          # validate_xml.py independently owns AUDIO start/end validation.
          fail=0
          mkdir -p /tmp/audio-logs
          while IFS= read -r corpus; do
            [ -z "$corpus" ] && continue
            xml_dir="$corpus/XML"
            audio_dir="$corpus/Audio"
            # Skip if XML/ doesn't exist (older corpora not re-laid-out).
            if [ ! -d "$xml_dir" ]; then
              echo "::warning::Skipping $corpus — no XML/ dir."
              continue
            fi
            if [ ! -d "$audio_dir" ] || ! find "$audio_dir" -type f \
                 \( -iname '*.mp3' -o -iname '*.wav' -o -iname '*.flac' \
                    -o -iname '*.ogg' -o -iname '*.m4a' \) -print -quit \
                 | grep -q .; then
              echo "::notice::Skipping local-audio checks for $corpus — no local audio files."
              continue
            fi
            echo "::group::validate_audio $corpus"
            log_dir="/tmp/audio-logs/$(basename "$corpus")"
            if ! python QC/validation/validate_audio.py \
                 --xml_path "$xml_dir" \
                 --path "$audio_dir" \
                 --log_dir "$log_dir"; then
              fail=1
            fi
            echo "::endgroup::"
          done < changed_corpora.txt
          exit $fail
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Upload broken_audio.csv artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-validation-pr-logs
          path: /tmp/audio-logs/
          retention-days: 30
