name: tests

on:
  pull_request:
    paths:
      - 'QC/**'
      - 'tests/**'
      - 'Corpora/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'docs/tools/**'
      - 'docs/site/**'
      - 'docs/theme/**'
      - 'docs/translations/**'
      - 'mkdocs.yml'
      - 'requirements-site.txt'
      - 'readme_sections_pending.txt'
      # Files that tests read from the live tree (each named in a test):
      - 'generate_xml_pending.txt'      # tests/corpora/test_generate_xml.py
      - 'provenance_pending.txt'        # tests/corpora/test_provenance.py
      - 'audio_sources.json'            # tests/validators/test_hf_audio_scope.py
      - 'languages.csv'                 # QC/corpus_counts.py, run by validator tests
      - 'dialects.csv'                  # QC/validation/_dialect_inventory.py
      - 'standards.csv'                 # QC/validation/_dialect_inventory.py
      - 'Orthographies/**'              # tests/utilities/test_orthography_table_integrity.py
      - '.claude/skills/**'             # tests/skills/test_skill_citations.py
      - '.github/workflows/**'          # tests/validators/test_ci_changed_xml_pathspec.py, test_hf_audio_scope.py
  push:
    branches: [main]
    paths:
      - 'QC/**'
      - 'tests/**'
      - 'Corpora/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'docs/tools/**'
      - 'docs/site/**'
      - 'docs/theme/**'
      - 'docs/translations/**'
      - 'mkdocs.yml'
      - 'requirements-site.txt'
      - 'readme_sections_pending.txt'
      # Files that tests read from the live tree (each named in a test):
      - 'generate_xml_pending.txt'      # tests/corpora/test_generate_xml.py
      - 'provenance_pending.txt'        # tests/corpora/test_provenance.py
      - 'audio_sources.json'            # tests/validators/test_hf_audio_scope.py
      - 'languages.csv'                 # QC/corpus_counts.py, run by validator tests
      - 'dialects.csv'                  # QC/validation/_dialect_inventory.py
      - 'standards.csv'                 # QC/validation/_dialect_inventory.py
      - 'Orthographies/**'              # tests/utilities/test_orthography_table_integrity.py
      - '.claude/skills/**'             # tests/skills/test_skill_citations.py
      - '.github/workflows/**'          # tests/validators/test_ci_changed_xml_pathspec.py, test_hf_audio_scope.py

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        run: pytest
      - name: Corpus pages registered and READMEs in the approved layout
        run: python docs/tools/manage_corpus_pages.py check --strict
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30
