name: Token Count Delta

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Ref or SHA to compare against
        required: false
        default: origin/main
      compare_ref:
        description: Ref or SHA to analyze
        required: false
  pull_request:
    paths:
      - "Corpora/**"
      - "QC/count_tokens.py"
      - "QC/tokens_delta.py"
      - "QC/plot_counts.py"
      - "QC/plot_deltas.py"
      - "QC/corpus_metrics.py"
      - "QC/corpus_counts.py"
      - ".github/workflows/token-comparison.yaml"
  push:
    branches:
      - main
    tags:
      - v1.*
    paths:
      - "Corpora/**"
      - "QC/count_tokens.py"
      - "QC/tokens_delta.py"
      - "QC/plot_counts.py"
      - "QC/plot_deltas.py"
      - "QC/corpus_metrics.py"
      - "QC/corpus_counts.py"
      - ".github/workflows/token-comparison.yaml"

jobs:
  compare-token-counts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout compare ref
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.compare_ref || github.sha }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install plotting dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install matplotlib

    - name: Resolve base ref
      id: base
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_BASE_REF: ${{ inputs.base_ref }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
      run: |
        if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
          BASE_REF="$PR_BASE_SHA"
        elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
          BASE_REF="$PUSH_BEFORE_SHA"
        else
          BASE_REF="${INPUT_BASE_REF:-origin/main}"
        fi

        BASE_SOURCE="event"
        if ! git rev-parse --verify "$BASE_REF^{commit}" >/dev/null 2>&1; then
          echo "Requested base $BASE_REF is not available locally; attempting an explicit fetch."
          git fetch --no-tags origin "$BASE_REF" || true
        fi
        if ! git rev-parse --verify "$BASE_REF^{commit}" >/dev/null 2>&1; then
          if git rev-parse --verify "HEAD^{commit}^" >/dev/null 2>&1; then
            echo "::warning::Base $BASE_REF is unreachable, likely after rewritten history; comparing with HEAD^."
            BASE_REF="HEAD^"
            BASE_SOURCE="first-parent-fallback"
          else
            echo "::warning::No base commit is available; comparing HEAD with itself."
            BASE_REF="HEAD"
            BASE_SOURCE="head-fallback"
          fi
        fi

        RESOLVED_BASE="$(git rev-parse --verify "$BASE_REF^{commit}")"
        RESOLVED_HEAD="$(git rev-parse --verify "HEAD^{commit}")"
        if [[ "$RESOLVED_BASE" == "$RESOLVED_HEAD" && "$BASE_SOURCE" == "event" && "$EVENT_NAME" == "push" ]]; then
          if git rev-parse --verify "HEAD^{commit}^" >/dev/null 2>&1; then
            echo "::warning::Push base resolves to HEAD; comparing with HEAD^ instead."
            BASE_REF="HEAD^"
            BASE_SOURCE="first-parent-fallback"
          fi
        fi

        echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
        echo "base_source=$BASE_SOURCE" >> "$GITHUB_OUTPUT"
        git show -s --format='Base: %H %cI %s' "$BASE_REF"
        git show -s --format='Compare: %H %cI %s' HEAD

    - name: Create artifact directory
      run: mkdir -p token-count-artifacts

    - name: Which corpora did this change touch?
      id: scope
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ steps.base.outputs.base_ref }}
      run: |
        # An untouched corpus counts the same before and after, so only touched
        # corpora are counted. Everything is counted when the counting code or
        # this workflow changed, and on a manual run.
        range="$BASE...HEAD"; [ "$EVENT" = workflow_dispatch ] && range=""
        python3 QC/validation/touched_corpora.py --range "$range" --out touched.txt \
          --code QC/count_tokens.py --code QC/corpus_counts.py --code QC/xml_forms.py \
          --code QC/tokens_delta.py --code QC/plot_counts.py --code QC/plot_deltas.py \
          --code languages.csv --code QC/validation/touched_corpora.py \
          --code .github/workflows/token-comparison.yaml >> "$GITHUB_OUTPUT"

    - name: Run token count on compare ref
      env:
        SCOPE: ${{ steps.scope.outputs.scope }}
      run: |
        if [ "$SCOPE" = all ]; then
          python3 QC/count_tokens.py Corpora > token-count-artifacts/current_token_count.json
        else
          # Only the touched corpora, unpacked as committed at HEAD.
          rm -rf /tmp/tc-head && mkdir -p /tmp/tc-head
          paths=(); while IFS= read -r c; do git cat-file -e "HEAD:Corpora/$c" 2>/dev/null && paths+=("Corpora/$c"); done < touched.txt
          mkdir -p /tmp/tc-head/Corpora
          [ ${#paths[@]} -eq 0 ] || git archive HEAD "${paths[@]}" | tar -x -C /tmp/tc-head
          python3 QC/count_tokens.py /tmp/tc-head/Corpora > token-count-artifacts/current_token_count.json
        fi

    - name: Run token count on base ref
      env:
        SCOPE: ${{ steps.scope.outputs.scope }}
        BASE: ${{ steps.base.outputs.base_ref }}
      run: |
        if [ "$SCOPE" = all ]; then
          git worktree add --detach /tmp/token-count-base "$BASE"
          python3 QC/count_tokens.py /tmp/token-count-base/Corpora > token-count-artifacts/base_token_count.json
          git worktree remove --force /tmp/token-count-base
        else
          rm -rf /tmp/tc-base && mkdir -p /tmp/tc-base/Corpora
          paths=(); while IFS= read -r c; do git cat-file -e "$BASE:Corpora/$c" 2>/dev/null && paths+=("Corpora/$c"); done < touched.txt
          [ ${#paths[@]} -eq 0 ] || git archive "$BASE" "${paths[@]}" | tar -x -C /tmp/tc-base
          python3 QC/count_tokens.py /tmp/tc-base/Corpora > token-count-artifacts/base_token_count.json
        fi

    - name: Compute token deltas
      run: |
        python3 QC/tokens_delta.py \
          token-count-artifacts/base_token_count.json \
          token-count-artifacts/current_token_count.json \
          token-count-artifacts/token_delta.json

    - name: Add token delta summary
      run: |
        python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import json
        from pathlib import Path

        current = json.loads(Path("token-count-artifacts/current_token_count.json").read_text())
        base = json.loads(Path("token-count-artifacts/base_token_count.json").read_text())
        deltas = json.loads(Path("token-count-artifacts/token_delta.json").read_text())

        current_total = sum(lang[0] for lang in current.values())
        base_total = sum(lang[0] for lang in base.values())
        delta_total = current_total - base_total
        rows = sorted(((lang, vals[0]) for lang, vals in deltas.items() if vals[0]), key=lambda row: abs(row[1]), reverse=True)

        scoped = "${{ steps.scope.outputs.scope }}" != "all"
        label = "Touched corpora: " if scoped else ""
        print("# Token Count Delta")
        print()
        print("Baseline source: `${{ steps.base.outputs.base_source }}`")
        if scoped:
            print("Counted only the corpora this change touched: " + ", ".join(
                Path("touched.txt").read_text().split()) + ".")
        print(f"{label}before: `{base_total:,}`" if scoped else f"Base total: `{base_total:,}`")
        print(f"{label}after: `{current_total:,}`" if scoped else f"Current total: `{current_total:,}`")
        print(f"Delta: `{delta_total:+,}`")
        print()
        print("| Language | Delta |")
        print("| --- | ---: |")
        for lang, delta in rows[:20]:
            print(f"| {lang} | {delta:+,} |")
        PY

    - name: Generate token plots
      working-directory: token-count-artifacts
      env:
        SCOPE: ${{ steps.scope.outputs.scope }}
      run: |
        python3 ../QC/plot_deltas.py token_delta.json
        # Plots of current counts would show only the touched corpora; skip them.
        [ "$SCOPE" = all ] || exit 0
        python3 ../QC/plot_counts.py current_token_count.json 0
        mv plot.png language_dialect_counts.png
        python3 ../QC/plot_counts.py current_token_count.json 1
        mv plot.png language_counts.png

    - name: Upload token count artifacts
      uses: actions/upload-artifact@v4
      with:
        name: token-count-delta
        path: token-count-artifacts/
        retention-days: 30
