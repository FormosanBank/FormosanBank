[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# --cov=QC measures only QC code imported into the test process itself.
# Scripts that tests launch with subprocess (the usual pattern, see
# tests/README.md) are not measured, so coverage.xml understates what the
# suite exercises. Coverage is report-only, not gated, per the design's
# coverage decision; the signal here is test pass/fail, not the number.
addopts = "--cov=QC --cov-report=term-missing --cov-report=xml"

[tool.pyright]
venvPath = "."
venv = ".venv"
