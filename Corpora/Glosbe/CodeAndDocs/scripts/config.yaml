    en_glosbe: "https://en.glosbe.com"
    app_glosbe: "https://app.glosbe.com"
    iapi3: "https://iapi.glosbe.com/iapi3/translate"

metadata:
  retrieved_date: "2026-06-29"

reviewed_amis_chinese:
