  simplified_json: "work/json/cleaned_amis_chinese_translations.json"
  traditional_xml: "work/reference_glosbe/amis_glosbe_traditional.xml"
  contributor: "Joseph Lin"
  pull_request: "https://github.com/FormosanBank/Formosan-Glosbe/pull/1"

